[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiftstream"
version = "0.1.0"
description = "Python event processing pipeline with Kafka, pluggable transforms, and multiple sinks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jean Claude Mugisha" },
]
dependencies = [
    "confluent-kafka>=2.3.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "pyarrow>=15.0.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-PyYAML>=6.0.12",
    "types-boto3>=1.34.0",
    "types-psycopg2>=2.9.21",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "pyarrow.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
